# Static CRT: the executable runs on a clean Windows 10/11 install without the
# Visual C++ Redistributable (vcruntime140.dll). Required for the standalone
# installer and the portable zip.
# See docs/decisions/adr_0002_static_crt.md.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
