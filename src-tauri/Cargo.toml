[package]
name = "forza-hud-native"
version = "0.1.0"
description = "HUD de telemetria do Forza — overlay nativo Direct2D (Windows)"
authors = ["you"]
edition = "2021"

# Binário único: `forza-hud-native` (main.rs) = overlay Direct2D in-game.

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# O sufixo `_lib` evita conflito de nome entre a lib e o binário no Windows.
# Ver https://github.com/rust-lang/cargo/issues/8519
name = "forza_hud_native_lib"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arc-swap = "1"
tiny_http = "0.12"

# Contrato compartilhado com o veloryft-back (DTOs de rede). Path dep: exige os
# repos lado a lado. Futuro: mover veloryft-core p/ repo próprio ou git dep.
veloryft-core = { path = "../../veloryft-back/crates/core" }

# Overlay nativo: Direct2D + win32 (janela layered, click-through).
[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Dwm",
  "Win32_UI_Shell",
]

[target.'cfg(windows)'.dependencies.windows-numerics]
version = "0.2"

# Metadados do exe (ícone, version info) — ver build.rs.
[build-dependencies]
winresource = "0.1"

# Release de distribuição: binário menor e mais difícil de inspecionar
# (LTO + 1 unidade de codegen + símbolos removidos).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
